# ATTENTION : ce fichier contient des identifiants en clair, il ne doit jamais être commité tel quel.
# En prod : générer via `kubectl create secret` en CLI, ou chiffrer avec Sealed Secrets / Vault
# avant de le stocker dans GitLab.

# C'est un fichier d'exemple !
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: sentinel-vision
type: Opaque
stringData:
  POSTGRES_DB: detection_db
  POSTGRES_USER: detection_user
  POSTGRES_PASSWORD: change_this_before_deploying
  DATABASE_URL: postgresql://detection_user:change_this_before_deploying@postgres:5432/detection_db
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: sentinel-vision
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: change_this_before_deploying
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: change_this_before_deploying