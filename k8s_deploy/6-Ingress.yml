# Template : les placeholders __DOMAIN__, __EMAIL__ et les blocs TLS sont
# remplis par deploy.sh au moment du déploiement (voir questions posées au lancement).
# k3s embarque Traefik par défaut -> ingressClassName: traefik fonctionne direct.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: detection-api-ingress
  namespace: sentinel-vision
  annotations:
    __CERT_MANAGER_ANNOTATION__
spec:
  ingressClassName: traefik
  __TLS_BLOCK__
  rules:
    - host: __DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: detection-api
                port:
                  number: 80