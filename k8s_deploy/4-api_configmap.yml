apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: sentinel-vision
data:
  # Les noms de service Kubernetes font office de DNS interne au cluster :
  # "postgres" et "minio" résolvent vers les Services définis dans 02- et 03-.
  # Le mot de passe DB reste dans le Secret (voir 01-secrets.yaml) : jamais en clair ici.
  MINIO_ENDPOINT: "http://minio:9000"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

  # Config du modèle actif : on privilégie .pt (natif PyTorch/Ultralytics),
  # qui fonctionne aussi bien avec un GPU NVIDIA (CUDA) qu'AMD (ROCm) — contrairement
  # à l'export ONNX qui, lui, dépend d'un provider CUDA-only sur ce projet.
  MODEL_NAME: "yolo-military-detection"
  MODEL_VERSION: "v10.0"
  STORAGE_BACKEND: "s3"
  S3_MODEL_BUCKET: "ml-models"
  # /shared correspond au point de montage du volume partagé "weights-volume"
  # dans l'initContainer seed-model (voir 5-api_deployment.yml) - pas /weights,
  # qui n'existe que dans l'image weights-loader avant la copie.
  LOCAL_WEIGHTS_PATH: "/shared/best.pt"